name: ClearQueue
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClearQueue:
    type: application
    platform: iOS
    sources: [ClearQueue, Shared]
    dependencies:
      - target: ClearQueueWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ClearQueue
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Clear Queue"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "ClearQueue reads the currently playing song and resets the Music queue to just that song."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  ClearQueueWidget:
    type: app-extension
    platform: iOS
    sources: [ClearQueueWidget, Shared]
    info:
      path: ClearQueueWidget/Info.plist
      properties:
        CFBundleDisplayName: Clear Queue
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleMusicUsageDescription: "ClearQueue reads the currently playing song and resets the Music queue to just that song."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ClearQueue.Widget
        SKIP_INSTALL: YES
