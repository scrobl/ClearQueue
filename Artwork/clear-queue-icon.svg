<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E1065"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D8D"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="260" fill="url(#accent)" opacity="0.25" filter="url(#glow)"/>

  <!-- the one song that stays: solid row with a play mark -->
  <g transform="translate(192,286)">
    <rect x="0" y="0" width="92" height="92" rx="24" fill="url(#accent)"/>
    <path d="M36 25 L68 46 L36 67 Z" fill="#FFFFFF"/>
    <rect x="130" y="24" width="510" height="44" rx="22" fill="#FFFFFF"/>
  </g>

  <!-- queue rows being swept away -->
  <g stroke-linecap="round">
    <g transform="translate(192,456)">
      <rect x="0" y="0" width="92" height="92" rx="24" fill="#FFFFFF" opacity="0.28"/>
      <rect x="130" y="24" width="440" height="44" rx="22" fill="url(#fade)"/>
    </g>
    <g transform="translate(192,626)">
      <rect x="0" y="0" width="92" height="92" rx="24" fill="#FFFFFF" opacity="0.14"/>
      <rect x="130" y="24" width="340" height="44" rx="22" fill="url(#fade)" opacity="0.6"/>
    </g>
  </g>

  <!-- sweep / clear stroke -->
  <path d="M560 470 C 700 430, 790 520, 850 690" fill="none" stroke="url(#accent)" stroke-width="30" stroke-linecap="round" opacity="0.9"/>
  <circle cx="850" cy="690" r="44" fill="url(#accent)"/>
  <path d="M832 672 L868 708 M868 672 L832 708" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
</svg>
